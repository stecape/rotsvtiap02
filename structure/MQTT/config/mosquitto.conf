# =============================================
# Mosquitto MQTT Broker Configuration
# =============================================

# Persistenza
persistence true
persistence_location /mosquitto/data/

# Log
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# =============================================
# Listener 1: MQTT Standard (TCP)
# =============================================
# Porta esposta direttamente dal container (1883)
listener 1883
protocol mqtt
allow_anonymous true

# =============================================
# Listener 2: MQTT WebSocket
# =============================================
# Esposto via Traefik su wss://mqtt.rotsvtiap02
listener 9001
protocol websockets
allow_anonymous true

# =============================================
# Opzioni di sicurezza (opzionali)
# =============================================
# Per abilitare autenticazione, decommentare:
# allow_anonymous false
# password_file /mosquitto/config/passwd

# Per limitare accesso da specifici host:
# acl_file /mosquitto/config/acl

# =============================================
# Performance
# =============================================
max_connections -1
max_keepalive 65535
# max_packet_size 0 non è valido, rimuovo o imposto un valore > 20
# message_size_limit 0
