# =============================================
# NGINX - Reverse Proxy locale (rotsvtiap02)
# =============================================
# Porta 80: proxy HTTP verso Traefik
# Porta 443: riservata per HTTPS self-signed (futuro)

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# =============================================
# HTTP: Proxy verso Traefik
# =============================================
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gestione header Connection per WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream: Traefik HTTP (porta interna, non esposta sull'host)
    upstream traefik_backend {
        server traefik:80;
    }

    # =============================================
    # HTTP :80 — Proxy a Traefik
    # =============================================
    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass         http://traefik_backend;
            proxy_http_version 1.1;

            # Preserva l'hostname originale per il routing Traefik
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout estesi per LLM su CPU (llama3.2 può impiegare 2-3 min)
            proxy_read_timeout    600s;
            proxy_send_timeout    600s;
            proxy_connect_timeout  30s;

            # WebSocket support
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # =============================================
    # HTTPS :443 — Self-signed (futuro)
    # =============================================
    # Decommentare dopo aver generato i certificati:
    #   openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
    #     -keyout /etc/nginx/certs/rotsvtiap02.key \
    #     -out    /etc/nginx/certs/rotsvtiap02.crt \
    #     -subj "/CN=*.rotsvtiap02"
    #
    # server {
    #     listen 443 ssl;
    #     server_name _;
    #
    #     ssl_certificate     /etc/nginx/certs/rotsvtiap02.crt;
    #     ssl_certificate_key /etc/nginx/certs/rotsvtiap02.key;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
