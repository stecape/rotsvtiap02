# Docker Compose - Core Infrastructure (rotsvtiap02 locale)
# Nginx :80/:443 → Traefik (routing via Docker labels)
# I servizi sono definiti in file separati nella directory services/

version: '3.8'

services:
  # =============================================
  # NGINX - Reverse Proxy (HTTP ora, HTTPS futuro)
  # =============================================
  nginx-multiplexer:
    image: nginx:alpine
    container_name: nginx-multiplexer
    restart: unless-stopped
    networks:
      - proxy
    ports:
      - "80:80"       # HTTP → proxy a Traefik
      - "443:443"     # Riservato HTTPS self-signed (futuro)
    volumes:
      - ./nginx/stream/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/stream/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - traefik

  # =============================================
  # TRAEFIK - Reverse Proxy & Routing
  # =============================================
  traefik:
    image: traefik:v3
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
    ports:
      - "8090:8080"              # Dashboard accessibile da rete locale (http://IP-VM:8090)
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/config:/config:ro
      - ./traefik/logs:/var/log/traefik

  # =============================================
  # CROWDSEC - IPS/IDS Anti Bruteforce
  # =============================================
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - crowdsec-db:/var/lib/crowdsec/data/
      - crowdsec-config:/etc/crowdsec/
      - ./traefik/logs:/var/log/traefik:ro
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
    networks:
      - proxy
    security_opt:
      - no-new-privileges:true

  # =============================================
  # CROWDSEC BOUNCER - Traefik Integration
  # =============================================
  bouncer-traefik:
    image: fbonalair/traefik-crowdsec-bouncer:latest
    container_name: bouncer-traefik
    restart: unless-stopped
    environment:
      - CROWDSEC_BOUNCER_API_KEY=${CROWDSEC_API_KEY}
      - CROWDSEC_AGENT_HOST=crowdsec:8080
    networks:
      - proxy
    depends_on:
      - crowdsec
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    name: proxy
    driver: bridge
  backend:
    name: backend
    driver: bridge

volumes:
  crowdsec-db:
    driver: local
  crowdsec-config:
    driver: local
