services:
  # =============================================
  # PostgreSQL - Database Server
  # =============================================
  # NON esposto all'esterno, accessibile solo da:
  # - Altri container nella rete 'db-network'
  # - Servizi backend che si collegano alla rete 'db-network'
  postgres:
    image: pgvector/pgvector:pg18
    container_name: postgres
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro  # Script SQL di inizializzazione (opzionale)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    # NOTA: NON esporre porte esterne (5432:5432) per sicurezza

  # =============================================
  # PGAdmin - Web UI per PostgreSQL
  # =============================================
  # Accessibile dall'esterno via Traefik su https://pgadmin.rotsvtiap02
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    networks:
      - backend       # Per accedere a PostgreSQL
      - proxy         # Per essere esposto da Traefik
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      
      # HTTP Router
      - "traefik.http.routers.pgadmin.entrypoints=http"
      - "traefik.http.routers.pgadmin.rule=Host(`pgadmin.rotsvtiap02`)"
      - "traefik.http.routers.pgadmin.service=pgadmin"
      - "traefik.http.routers.pgadmin.middlewares=security-headers@file,rate-limit@file"
      
      # Service (porta interna del container)
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
      
      # Network da usare (importante quando il container è su più reti)
      - "traefik.docker.network=proxy"
    # security_opt:
    #   - no-new-privileges:true

networks:
  # Rete interna per tutti i servizi backend (DB, MQTT, apps)
  backend:
    name: backend
    driver: bridge
  
  # Rete esterna per Traefik (deve esistere già)
  proxy:
    external: true

volumes:
  postgres-data:
    driver: local
  pgadmin-data:
    driver: local
