services:
  wiki-rag:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: RAG
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Source code montato dal host → hot-reload
      - .:/app
      # node_modules e .next rimangono DENTRO il container (non sovrascritta dal mount)
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - NODE_ENV=development
      # Polling necessario per file watching dentro Docker (inotify non sempre funziona)
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # NOTA: ADMIN_PASSWORD_HASH viene passato qui (non in .env) perché
      # Next.js usa dotenv-expand che espande $VARNAME nell'hash bcrypt.
      # Docker Compose converte $$ → $ prima di passarlo al container.
      - ADMIN_PASSWORD_HASH=$$2a$$10$$cH8EeO7bVtF./2XrRGvCiOKq6HjCCEu50rXQsaHsXLNmY8/ZOyzse
    env_file:
      - .env
    networks:
      - backend
      - proxy
    labels:
      - "traefik.enable=true"
      # HTTP Router
      - "traefik.http.routers.wiki-rag.entrypoints=http"
      - "traefik.http.routers.wiki-rag.rule=Host(`wiki.rotsvtiap02`)"
      - "traefik.http.routers.wiki-rag.service=wiki-rag"
      - "traefik.http.routers.wiki-rag.middlewares=security-headers@file"
      # Service
      - "traefik.http.services.wiki-rag.loadbalancer.server.port=3000"
      # Network da usare per Traefik
      - "traefik.docker.network=proxy"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      # Mantieni il modello carico in RAM a tempo indeterminato (evita cold start)
      - OLLAMA_KEEP_ALIVE=-1
      # Tempo massimo per il caricamento del modello in RAM
      - OLLAMA_LOAD_TIMEOUT=300s
    mem_limit: 2g
    memswap_limit: 2g
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - backend

volumes:
  node_modules:
  next_cache:
  ollama_data:

networks:
  # Rete condivisa con il container postgres
  backend:
    external: true
  # Rete Traefik (già esistente)
  proxy:
    external: true
